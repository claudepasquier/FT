# Native build + unit tests for the FT core (GitHub Actions).
# Mirrors the quality gates documented in the repository (core tests), so the
# GitHub mirror runs the same checks as the local `cd core && make test`.
# The WASM module is committed (Koda runners cannot pull the Emscripten
# toolchain), so no WASM build is needed here.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run core tests
        run: |
          cd core
          make test
