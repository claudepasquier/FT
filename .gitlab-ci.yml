# GitLab CI for FT modernization (Koda CNRS).
#
# Koda runners only allow images from bin.koda.cnrs.fr/docker-ci/*, so all
# jobs run from the allowed `podman` image; the compiler jobs execute
# gcc/emcc inside podman containers.
#
# Note: if your Koda admin whitelists gcc:13 / emscripten/emsdk, you can
# switch back to using them directly.

stages:
  - build
  - test
  - pages
  - mirror

image: bin.koda.cnrs.fr/docker-ci/podman/stable

# docker.io is blocked from Koda runners; try registries reachable from
# CNRS networks: mirror.gcr.io (Google's Docker Hub mirror), then quay.io
# fallbacks. If your admin whitelists images, prefer bin.koda.cnrs.fr
# internal mirrors.
.build-native-script: &build-native-script
  - podman run --rm -v "$PWD":/src -w /src mirror.gcr.io/library/gcc:13 make -C core refcli test

.build-wasm-script: &build-wasm-script
  - >
    for IMG in mirror.gcr.io/emscripten/emsdk:3.1.68; do
      echo "Trying $IMG";
      if podman run --rm -v "$PWD":/src -w /src "$IMG" make -C core wasm; then exit 0; fi;
    done; exit 1

build-core-native:
  stage: build
  script: *build-native-script

build-core-wasm:
  stage: build
  script: *build-wasm-script
  artifacts:
    paths:
      - web/src/wasm/

pages:
  stage: pages
  needs:
    - job: build-core-wasm
      artifacts: true
  script:
    - mkdir -p public
    - cp -r web/index.html web/src public/
    - mkdir -p public/docs
    - cp -r docs/* public/docs/
    - cp README.md LICENSE CITATION.cff public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Automatic push mirror to GitHub (fallback if Koda's built-in
# Repository-Mirroring UI is restricted).
# Required CI/CD variables (Settings > CI/CD > Variables, masked):
#   GITHUB_MIRROR_URL : git@github.com:<user>/<repo>.git
#   GITHUB_MIRROR_KEY : private SSH deploy key with write access
mirror-github:
  stage: mirror
  allow_failure: true   # does not block the pipeline until variables are set
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$GITHUB_MIRROR_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
  script:
    - git clone --mirror "$CI_REPOSITORY_URL" repo.git
    - cd repo.git
    - git remote add mirror "$GITHUB_MIRROR_URL"
    - git push --mirror mirror
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
