# GitLab CI for FT modernization (Koda CNRS).
#
# Koda runners only allow images from bin.koda.cnrs.fr/docker-ci/* and block
# external registries (docker.io, mirror.gcr.io), so the toolchain cannot be
# pulled in CI. The WASM module (web/src/wasm/fourt.js + fourt.wasm) is
# therefore committed to the repository, built locally with:
#     cd core && make wasm        (requires the Emscripten SDK)
#
# Only the allowed podman image is used, for the Pages deployment.

stages:
  - pages
  - mirror

image: bin.koda.cnrs.fr/docker-ci/podman/stable

pages:
  stage: pages
  script:
    - mkdir -p public
    - cp -r web/index.html web/src public/
    - mkdir -p public/docs
    - cp -r docs/* public/docs/
    - cp README.md LICENSE CITATION.cff AUTHORS.md public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Automatic push mirror to GitHub (fallback if Koda's built-in
# Repository-Mirroring UI is restricted).
# Required CI/CD variables (Settings > CI/CD > Variables, masked):
#   GITHUB_MIRROR_URL : git@github.com:<user>/<repo>.git
#   GITHUB_MIRROR_KEY : private SSH deploy key with write access
mirror-github:
  stage: mirror
  allow_failure: true   # does not block the pipeline until variables are set
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$GITHUB_MIRROR_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
  script:
    - git clone --mirror "$CI_REPOSITORY_URL" repo.git
    - cd repo.git
    - git remote add mirror "$GITHUB_MIRROR_URL"
    - git push --mirror mirror
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
